
# Every check and smoke in the app repo, plus tsc, on every push.
#
# 16 scripts + `tsc --noEmit`. ~42s locally.
#
# ONE HALF OF ONE CHECK DOES NOT RUN HERE. check-production-build.js verifies
# two separate things: the app.config.js shape (INTERNET permission, https
# apiBaseUrl, ATS) and the existence of the EAS production secrets. The second
# half shells out to the `eas` CLI, and without an authenticated session it
# prints "⚠ EAS secret check skipped" and still exits 0 — deliberate, because a
# partial answer must not read as an absence. The runner echoes a line whenever
# that happens, so a green run here never quietly means more than it proved.
#
# To make that half run too: add an EXPO_TOKEN repository secret and uncomment
# the two steps at the bottom. That is a credential decision, so it is left off
# until someone makes it on purpose.
#
# THE CONFIG half — the one that runs unconditionally — is the half that caused
# the May 2026 Android outage, where a build shipped with no INTERNET permission
# and nobody found out until users could not sign in.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # - name: Install eas-cli   # only useful with EXPO_TOKEN set
      #   run: npm i -g eas-cli

      - name: Run all checks
        run: node scripts/ci-run-all.js
        # env:
        #   EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
